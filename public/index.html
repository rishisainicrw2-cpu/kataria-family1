<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HINDU ESPORTS</title>
<meta name="description" content="HINDU ESPORTS — Together as One ✦ Private clan chat, match plans and highlights.">
<meta name="theme-color" content="#a63a05">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="boot" class="screen">
  <video class="logo" id="bootVideo" src="/assets/wake.mp4" poster="/assets/icon-512.png"
    autoplay muted loop playsinline webkit-playsinline="true" disablepictureinpicture preload="auto"></video>
  <img class="logo hidden" id="bootImg" src="/assets/icon-512.png" alt="Hindu Esports">
  <h1 class="sr">HINDU ESPORTS</h1>
  <div class="tag">Together as One ✦</div>
  <div class="spinner" aria-label="Loading"></div>
</div>
<script>
// A few older/locked-down browsers refuse to autoplay even a muted video; fall back to the plain logo quietly.
(function () { var v = document.getElementById('bootVideo');
  if (!v) return;
  var toImg = function () { v.classList.add('hidden'); var i = document.getElementById('bootImg'); if (i) i.classList.remove('hidden'); };
  v.addEventListener('error', toImg);
  var p = v.play(); if (p && p.catch) p.catch(toImg);
})();
</script>
<div id="auth" class="screen hidden"></div>
<div id="app" class="hidden">
  <div id="offline" class="offline hidden">You are offline — messages will send when you reconnect</div>
  <header id="topbar"></header>
  <main id="view"></main>
  <nav id="nav" aria-label="Main"><div class="inner"></div></nav>
</div>
<div id="overlay"></div>
<script src="/js/core.js"></script>
<script src="/js/views.js"></script>
<script src="/js/chat.js"></script>
<script src="/js/features.js"></script>
<script src="/js/features2.js"></script>
<script src="/js/admin_recruit.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
