<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scrims & Tournaments</title>
<meta name="description" content="Scrims & Tournaments — join by invite link.">
<meta name="theme-color" content="#120d16">
<meta name="robots" content="noindex">
<!-- Deliberately no link to the clan's manifest, icons or stylesheet: this page shares nothing with the main app. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff9d2e'/%3E%3Cstop offset='1' stop-color='%23ff2d4d'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle'%3E%F0%9F%8F%86%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/scrims.css">
</head>
<body>
<div id="shell">

  <div id="splash">
    <div class="badge-logo">🏆</div>
    <h1>Scrims &amp; Tournaments</h1>
    <div class="tag">Match coordination &amp; announcements</div>
    <div id="splashBody">
      <div class="spinner" style="margin:20px auto"></div>
    </div>
  </div>

  <div id="chat">
    <div id="chathead">
      <div class="group-icon">🏆</div>
      <div class="grow">
        <h1>Scrims &amp; Tournaments</h1>
        <div class="sub" data-sub></div>
      </div>
      <button class="icon-btn" data-leave title="Leave group" aria-label="Leave group">🚪</button>
    </div>
    <div id="pinned"><div data-pinned></div></div>
    <div id="body"></div>
    <div id="adminbar">
      <button class="btn small ghost" data-announce>📣 Announcement</button>
      <button class="btn small ghost" data-room>🔑 Room info</button>
      <button class="btn small ghost" data-invites>✉️ Invite links</button>
      <button class="btn small ghost" data-players>👥 Players</button>
    </div>
    <div id="composer">
      <textarea rows="1" placeholder="Message" data-in aria-label="Message"></textarea>
      <button class="btn" data-send aria-label="Send">➤</button>
    </div>
  </div>

</div>
<div id="overlay"></div>
<script src="/js/scrims.js"></script>
</body>
</html>
