services:
  - type: web
    name: kataria-family
    runtime: node
    plan: free
    buildCommand: "echo no build needed"
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
